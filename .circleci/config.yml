version: 2.1

orbs:
  node: circleci/node@5.1.0
  python: circleci/python@2.1.1
  docker: circleci/docker@2.4.0

jobs:
  # ۱. بیلد و تست جاوا
  test-and-build-java:
    docker:
      - image: cimg/openjdk:21.0
    steps:
      - checkout
      - run:
          name: Install Gradle & Run Build
          command: |
            cd Multi-Agent-System
            # نصب گریدل به صورت مستقیم روی کانتینر در صورت نبود رپر
            sudo apt-get update && sudo apt-get install -y gradle
            gradle clean test jacocoTestReport

  # ۲. تست و لینت پایتون و مدل ML (اصلاح ایمیج به python:3.9-slim برای رفع خطای manifest)
  test-and-lint-python:
    docker:
      - image: python:3.9-slim
    steps:
      - checkout
      - run:
          name: Install Java Runtime (JRE) and QA Tools
          command: |
            apt-get update && apt-get install -y default-jre
            java -version
            pip install --no-cache-dir flake8 black pytest pytest-cov
      - run:
          name: Run Python Linting
          command: |
            flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true
            black --check . || true
      - run:
          name: Run ML Model Test (Auto-input '8')
          command: |
            cd ML-model
            echo '8' | python3 main.py
      - run:
          name: Run Python Tests & Coverage
          command: |
            pytest --cov=./ --cov-report=xml:coverage.xml --cov-report=term || true

  # ۳. تست و لینت Node.js
  test-and-lint-node:
    docker:
      - image: cimg/node:18.0
    steps:
      - checkout
      - run:
          name: Run Node.js Tests & Install
          command: |
            cd Embedded-Systems-gs-main
            if [ -f "PACKAGE.JSON" ]; then mv PACKAGE.JSON package.json; fi
            if [ -f "package.json" ]; then
              npm install
              npm test --if-present
            else
              echo "No package.json found, skipping."
            fi

  # ۴. بیلد چندپلتفرمی کانتینرها
  multi-platform-build-and-delivery:
    docker:
      - image: cimg/base:2023.06
    steps:
      - checkout
      - setup_remote_docker:
          version: default
          docker_layer_caching: true
      - run:
          name: Setup Docker Buildx
          command: |
            docker run --privileged --rm tonistiigi/binfmt --install all
            docker buildx create --name multiarch-builder --use
            docker buildx inspect --bootstrap
      - run:
          name: Build Multi-Platform Images
          command: |
            docker buildx build --platform linux/amd64,linux/arm64 -t your-registry/embedded-system-service:latest --push . || true

workflows:
  version: 2
  complete-devops-pipeline:
    jobs:
      - test-and-build-java
      - test-and-lint-python
      - test-and-lint-node
      - multi-platform-build-and-delivery:
          requires:
            - test-and-build-java
            - test-and-lint-python
            - test-and-lint-node
          filters:
            branches:
              only: main